<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier la Salle</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dist/css/styles.css') }}">
</head>
<body>
    <h1>Modifier la Salle #{{ salle[0] }}</h1>

    <form action="{{ url_for('modifier_salle', NumeroSalle=salle[0]) }}" method="POST">
        <label>Numéro de la Salle :</label>
        <input type="number" name="NumeroSalle" value="{{ salle[0] }}" readonly>

        <label>Étage :</label>
        <input type="number" name="Etage" value="{{ salle[1] }}" required>

        <label>Service :</label>
        <select name="Service" required>
            {% for service in ['Urgences', 'Pédiatrie', 'Chirurgie', 'Cardiologie', 'Radiologie'] %}
                <option value="{{ service }}" {% if salle[2] == service %}selected{% endif %}>
                    {{ service }}
                </option>
            {% endfor %}
        </select>

        <label>Objets associés :</label>
        <select name="ObjetID" multiple>
            {% for objet in objets %}
                <option value="{{ objet[0] }}"
                    {% if objet[0]|string in objets_associes %}selected{% endif %}>
                    [{{ objet[0] }}] {{ objet[1] }}
                </option>
            {% endfor %}
        </select>

        <label>Responsable :</label>
        <select name="pseudonyme" required>
            {% for user in utilisateurs %}
                <option value="{{ user[0] }}" {% if user[0] == salle[3] %}selected{% endif %}>
                    {{ user[0] }}
                </option>
            {% endfor %}
        </select>

        <button type="submit">💾 Enregistrer</button>
    </form>
</body>
</html>
