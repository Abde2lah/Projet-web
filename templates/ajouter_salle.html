<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter une Salle</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dist/css/styles.css') }}">
</head>
<body>
    <h1>Ajouter une Salle</h1>

    <form action="{{ url_for('ajouter_salle') }}" method="POST">
        <label>Numéro de la Salle :</label>
        <input type="number" name="NumeroSalle" required>

        <label>Étage :</label>
        <input type="number" name="Etage" required>

        <label>Service :</label>
        <select name="Service" required>
            <option value="">-- Choisir --</option>
            {% for s in ['Urgences', 'Pédiatrie', 'Chirurgie', 'Cardiologie', 'Radiologie'] %}
                <option value="{{ s }}">{{ s }}</option>
            {% endfor %}
        </select>

        <label>Objets associés :</label>
        <select name="ObjetID" multiple>
            {% for objet in objets %}
                <option value="{{ objet[0] }}">[{{ objet[0] }}] {{ objet[1] }}</option>
            {% endfor %}
        </select>

        <label>Utilisateur responsable :</label>
        <select name="pseudonyme" required>
            {% for user in utilisateurs %}
                <option value="{{ user[0] }}">{{ user[0] }}</option>
            {% endfor %}
        </select>

        <button type="submit">➕ Ajouter</button>
    </form>
</body>
</html>
